apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-deployment
  namespace: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: ngcicd/order-service:v1
        envFrom:
        - configMapRef:
            name: global-configmap
        - secretRef:
            name: global-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-service
  namespace: devops-platform
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
  - port: 8002
    targetPort: 8002
    nodePort: 30002