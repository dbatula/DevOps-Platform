apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  namespace: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: ngcicd/auth-service:v0.1.1
        envFrom:
        - configMapRef:
            name: global-configmap
        - secretRef:
            name: global-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-service
  namespace: devops-platform
spec:
  selector:
    app: auth-service
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
