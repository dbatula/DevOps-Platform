apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{.Values.services.order.replicas}}

  selector:
    matchLabels:
      app: order

  template:
    metadata:
      labels:
        app: order

    spec:
      containers:
      - name: order
        image: {{.Values.services.order.image}}

        envFrom:
        - configMapRef:
            name: {{.Values.global.envFrom.configMap}}
        - secretRef:
            name: {{.Values.global.envFrom.secret}}

        resources:
          requests:
            memory: {{.Values.services.order.resources.requests.memory}}
            cpu: {{.Values.services.order.resources.requests.cpu}}
          limits:
            memory: {{.Values.services.order.resources.limits.memory}}
            cpu: {{.Values.services.order.resources.limits.cpu}}

        ports:
        - containerPort: {{.Values.services.order.port}}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    app: order

  ports:
  - port: {{.Values.services.order.port}}
    targetPort: {{.Values.services.order.port}}