apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{.Values.services.user.replicas}}

  selector:
    matchLabels:
      app: user

  template:
    metadata:
      labels:
        app: user

    spec:
      containers:
      - name: user
        image: {{.Values.services.user.image}}

        envFrom:
        - configMapRef:
            name: {{.Values.global.envFrom.configMap}}
        - secretRef:
            name: {{.Values.global.envFrom.secret}}

        resources:
          requests:
            memory: {{.Values.services.user.resources.requests.memory}}
            cpu: {{.Values.services.user.resources.requests.cpu}}
          limits:
            memory: {{.Values.services.user.resources.limits.memory}}
            cpu: {{.Values.services.user.resources.limits.cpu}}

        ports:
        - containerPort: {{.Values.services.user.port}}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    app: user

  ports:
  - port: {{.Values.services.user.port}}
    targetPort: {{.Values.services.user.port}}
