apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{.Values.services.postgres.replicas}}

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
      - name: postgres
        image: {{.Values.services.postgres.image}}

        envFrom:
        - secretRef:
            name: {{.Values.global.envFrom.secret}}

        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: {{.Values.global.envFrom.configMap}}
              key: POSTGRES_DB

        resources:
          requests:
            memory: {{.Values.services.postgres.resources.requests.memory}}
            cpu: {{.Values.services.postgres.resources.requests.cpu}}
          limits:
            memory: {{.Values.services.postgres.resources.limits.memory}}
            cpu: {{.Values.services.postgres.resources.limits.cpu}}

        ports:
        - containerPort: {{.Values.global.postgres.port}}

        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data

      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    app: postgres

  ports:
  - port: {{.Values.global.postgres.port}}
    targetPort: {{.Values.global.postgres.port}}